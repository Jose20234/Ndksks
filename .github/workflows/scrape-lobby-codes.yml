name: Scrape Fortnite Lobby Codes

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cloudscraper beautifulsoup4

      - name: Run scraper
        run: |
          python3 scrape_codes.py \
            --output codes.json \
            --merge  codes.json

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codes.json
          if git diff --cached --quiet; then
            echo "No changes to codes.json, skipping commit."
          else
            ACTIVE=$(python3 -c "
          import json, sys
          d = json.load(open('codes.json'))
          a = sum(1 for c in d['codes'] if c['availability']=='active')
          print(f\"{a} active codes\")
          ")
            git commit -m "chore(codes): update lobby codes [$ACTIVE] $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
